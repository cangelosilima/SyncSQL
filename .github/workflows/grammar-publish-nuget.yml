name: Publish SyncSql.Grammar.PlSql to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'grammar/**'
      - 'cli/src/SyncSql.Grammar.PlSql/**'
      - 'cli/src/SyncSql.Lineage.Oracle/**'
      - 'cli/src/SyncSql.Core/**'
      - 'cli/tests/SyncSql.Lineage.Oracle.Tests/**'
      - 'cli/Directory.Build.props'
      - 'global.json'
      - '.github/workflows/grammar-publish-nuget.yml'
      - '.github/scripts/nuget-release*.cjs'
  pull_request:
    paths:
      - 'grammar/**'
      - 'cli/src/SyncSql.Grammar.PlSql/**'
      - 'cli/src/SyncSql.Lineage.Oracle/**'
      - 'cli/src/SyncSql.Core/**'
      - 'cli/tests/SyncSql.Lineage.Oracle.Tests/**'
      - 'cli/Directory.Build.props'
      - 'global.json'
      - '.github/workflows/grammar-publish-nuget.yml'
      - '.github/scripts/nuget-release*.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-grammar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test release automation
        run: node --test .github/scripts/nuget-release.test.cjs
      - name: Resolve CalVer
        id: version
        shell: pwsh
        run: |
          $timestamp = git show -s --format=%cI $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the build commit date.' }
          $date = [DateTimeOffset]::Parse($timestamp, [Globalization.CultureInfo]::InvariantCulture).UtcDateTime
          $revision = [int]$env:GITHUB_RUN_NUMBER
          if ($revision -lt 1 -or $revision -gt 65534) { throw 'Run number must be between 1 and 65534 for .NET assembly compatibility.' }
          $version = $date.ToString('yyyy.M.d', [Globalization.CultureInfo]::InvariantCulture) + ".$revision"
          if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -ne 'refs/heads/main') {
            $version += "-ci.$env:GITHUB_RUN_ATTEMPT"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=grammar-v$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test cli/tests/SyncSql.Lineage.Oracle.Tests/SyncSql.Lineage.Oracle.Tests.csproj --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Pack
        run: >-
          dotnet pack cli/src/SyncSql.Grammar.PlSql/SyncSql.Grammar.PlSql.csproj
          --configuration Release --output artifacts
          -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: SyncSql.Grammar.PlSql-nuget
          path: artifacts/SyncSql.Grammar.PlSql.*.nupkg
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.package.outputs.version }}
      PACKAGE_ID: SyncSql.Grammar.PlSql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: SyncSql.Grammar.PlSql-nuget
          path: artifacts
      - name: Reserve release tag at the tested main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { reserveTag } = require('./.github/scripts/nuget-release.cjs');
            await reserveTag({ github, context, tag: process.env.RELEASE_TAG });
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/SyncSql.Grammar.PlSql.$PACKAGE_VERSION.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release with the published package
        uses: actions/github-script@v7
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/nuget-release.cjs');
            await publishRelease({
              github, context, tag: process.env.RELEASE_TAG,
              packageId: process.env.PACKAGE_ID, version: process.env.PACKAGE_VERSION
            });
