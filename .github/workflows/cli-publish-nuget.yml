name: Publish SyncSql.Cli to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'grammar/**'
      - 'global.json'
      - '.github/workflows/cli-publish-nuget.yml'
      - '.github/scripts/nuget-release*.cjs'
      - '.github/scripts/windows-package*.cjs'
      - '.github/workflows/cli-publish-windows.yml'
      - '.github/scripts/*-cli-install.ps1'
      - '.github/scripts/prepare-winget.ps1'
      - '.github/scripts/install-nuget-tool*.ps1'
  pull_request:
    paths:
      - 'cli/**'
      - 'grammar/**'
      - 'global.json'
      - '.github/workflows/cli-publish-nuget.yml'
      - '.github/scripts/nuget-release*.cjs'
      - '.github/scripts/windows-package*.cjs'
      - '.github/workflows/cli-publish-windows.yml'
      - '.github/scripts/*-cli-install.ps1'
      - '.github/scripts/prepare-winget.ps1'
      - '.github/scripts/install-nuget-tool*.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test release automation
        run: node --test .github/scripts/nuget-release.test.cjs
      - name: Test public-install retry behavior
        shell: pwsh
        run: ./.github/scripts/install-nuget-tool.test.ps1
      - name: Resolve CalVer
        id: version
        shell: pwsh
        run: |
          $timestamp = git show -s --format=%cI $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the build commit date.' }
          $date = [DateTimeOffset]::Parse($timestamp, [Globalization.CultureInfo]::InvariantCulture).UtcDateTime
          $revision = [int]$env:GITHUB_RUN_NUMBER
          if ($revision -lt 1 -or $revision -gt 65534) { throw 'Run number must be between 1 and 65534 for .NET assembly compatibility.' }
          $version = $date.ToString('yyyy.M.d', [Globalization.CultureInfo]::InvariantCulture) + ".$revision"
          if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF -ne 'refs/heads/main') {
            $version += "-ci.$env:GITHUB_RUN_ATTEMPT"
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=cli-v$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test cli/SyncSql.slnx --configuration Release -p:ContinuousIntegrationBuild=true
      - name: Pack
        run: >-
          dotnet pack cli/src/SyncSql.Cli/SyncSql.Cli.csproj
          --configuration Release --output artifacts
          -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Smoke test the packaged tool
        run: |
          dotnet tool install SyncSql.Cli --tool-path "$RUNNER_TEMP/syncsql-tool" --add-source "$PWD/artifacts" --version "$PACKAGE_VERSION"
          "$RUNNER_TEMP/syncsql-tool/syncsql" --help
      - uses: actions/upload-artifact@v4
        with:
          name: SyncSql.Cli-nuget
          path: artifacts/SyncSql.Cli.*.nupkg
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.package.outputs.version }}
      PACKAGE_ID: SyncSql.Cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: SyncSql.Cli-nuget
          path: artifacts
      - name: Reserve release tag at the tested main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { reserveTag } = require('./.github/scripts/nuget-release.cjs');
            await reserveTag({ github, context, tag: process.env.RELEASE_TAG });
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/SyncSql.Cli.$PACKAGE_VERSION.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Create GitHub release with the published package
        uses: actions/github-script@v7
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/nuget-release.cjs');
            await publishRelease({
              github, context, tag: process.env.RELEASE_TAG,
              packageId: process.env.PACKAGE_ID, version: process.env.PACKAGE_VERSION
            });

  windows:
    needs: package
    uses: ./.github/workflows/cli-publish-windows.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      version: ${{ needs.package.outputs.version }}
      tag: ${{ needs.package.outputs.tag }}
      commit: ${{ github.sha }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  verify-nuget-install:
    needs: [package, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the exact public version, retrying until the feed is ready
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          ./.github/scripts/install-nuget-tool.ps1 -Version $env:VERSION
          Join-Path ([Environment]::GetFolderPath('UserProfile')) '.dotnet/tools' >> $env:GITHUB_PATH
      - name: Verify installed command and version
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: ./.github/scripts/assert-cli-install.ps1 -Version $env:VERSION
      - name: Uninstall the tool
        shell: pwsh
        run: |
          dotnet tool uninstall --global SyncSql.Cli
          if ($LASTEXITCODE) { throw 'dotnet tool uninstall failed.' }
          if (Get-Command syncsql -CommandType Application -ErrorAction SilentlyContinue) { throw 'syncsql is still on PATH after uninstall.' }
