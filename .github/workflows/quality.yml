# Adapted from GitHub's CodeQL and Dependency Review starter workflows:
# https://github.com/actions/starter-workflows/tree/main/code-scanning
name: Quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Audit npm dependencies (including development dependencies)
        id: npm-audit
        working-directory: site
        run: npm audit --package-lock-only --audit-level=low
      - name: Audit direct and transitive NuGet dependencies
        if: ${{ !cancelled() && steps.npm-audit.outcome != 'skipped' }}
        # Fail on all advisory severities and on unavailable audit data, even in
        # test projects that normally relax warnings-as-errors.
        run: >-
          dotnet restore cli/SyncSql.slnx --force --no-http-cache
          -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
          -p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905
      - name: Review dependency changes in pull requests
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build CLI for analysis
        if: matrix.build-mode == 'manual'
        run: dotnet build cli/SyncSql.slnx --configuration Release
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  cli-style:
    name: CLI lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore cli/SyncSql.slnx
      - name: Lint with .NET analyzers
        id: lint
        run: dotnet format analyzers cli/SyncSql.slnx --verify-no-changes --no-restore --exclude grammar/
      - name: Check formatting and code style
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: dotnet format cli/SyncSql.slnx --verify-no-changes --no-restore --exclude grammar/

  cli-coverage:
    name: CLI tests and coverage
    outputs:
      lines: ${{ steps.coverage-metrics.outputs.lines }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore cli/SyncSql.slnx
      - name: Build with .NET analyzers
        run: dotnet build cli/SyncSql.slnx --configuration Release --no-restore
      - name: Test with coverage
        id: tests
        run: >-
          dotnet test cli/SyncSql.slnx --configuration Release --no-build
          --collect "XPlat Code Coverage" --settings cli/coverage.runsettings
          --results-directory TestResults/quality
          --logger trx
      - name: Enforce CLI coverage threshold
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # 5.5.10
        with:
          reports: 'TestResults/quality/**/coverage.cobertura.xml'
          targetdir: TestResults/quality/report
          reporttypes: 'Html;Cobertura;MarkdownSummaryGithub;JsonSummary'
          # Unlock method/full-method coverage and the metrics overview.
          # Fork PRs have no repository secrets and retain the free coverage report.
          license: ${{ secrets.REPORTGENERATOR_LICENSE }}
          customSettings: 'minimumCoverageThresholds:lineCoverage=100;minimumCoverageThresholds:branchCoverage=100;minimumCoverageThresholds:methodCoverage=100;minimumCoverageThresholds:fullMethodCoverage=100'
      - name: Require every CLI line, branch, and method to be covered
        if: ${{ !cancelled() && hashFiles('TestResults/quality/report/Summary.json') != '' }}
        # Check raw counts as well, so rounding cannot hide an uncovered item.
        run: |
          jq -e '.summary |
            (.coverablelines > 0 and .totalbranches > 0 and .totalmethods > 0) and
            (.coveredlines == .coverablelines) and
            (.coveredbranches == .totalbranches) and
            (.coveredmethods == .totalmethods) and
            (.fullcoveredmethods == .totalmethods)' TestResults/quality/report/Summary.json
      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/quality/report/SummaryGithub.md') != '' }}
        run: cat TestResults/quality/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export CLI coverage percentage
        id: coverage-metrics
        if: ${{ !cancelled() && hashFiles('TestResults/quality/report/Summary.json') != '' }}
        run: |
          lines=$(jq -er '.summary.linecoverage | select(type == "number" and . >= 0 and . <= 100)' TestResults/quality/report/Summary.json)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
      - name: Upload CLI test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-cli-results
          path: TestResults/quality/
          if-no-files-found: error
          retention-days: 14

  site-style:
    name: Site lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Lint
        id: lint
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: npm run format:check

  site-coverage:
    name: Site tests and coverage
    outputs:
      lines: ${{ steps.coverage-metrics.outputs.lines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test and enforce coverage thresholds
        run: npm run test:coverage
      - uses: actions/setup-dotnet@v4
        if: ${{ !cancelled() && hashFiles('site/coverage/lcov.info') != '' }}
        with:
          global-json-file: global.json
      - name: Generate detailed Site coverage report
        if: ${{ !cancelled() && hashFiles('site/coverage/lcov.info') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@049f7ec958c672fd31d5cc1cb01622dc8d2e23ab # 5.5.10
        with:
          reports: 'site/coverage/lcov.info'
          sourcedirs: site
          targetdir: site/coverage/report
          reporttypes: 'Html;MarkdownSummaryGithub;JsonSummary'
          license: ${{ secrets.REPORTGENERATOR_LICENSE }}
          title: Site coverage
          customSettings: 'settings:defaultAssemblyName=Site'
      - name: Publish Site coverage summary
        if: ${{ !cancelled() && hashFiles('site/coverage/report/SummaryGithub.md') != '' }}
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export Site coverage percentage
        id: coverage-metrics
        if: ${{ !cancelled() && hashFiles('site/coverage/coverage-summary.json') != '' }}
        run: |
          lines=$(jq -er '.total.lines.pct | select(type == "number" and . >= 0 and . <= 100)' coverage/coverage-summary.json)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
      - name: Upload site coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-site-coverage
          path: site/coverage/
          if-no-files-found: error
          retention-days: 14

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub workflows
        run: >-
          docker run --rm --volume "$PWD/.github:/repo/.github:ro" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -ignore 'label "oracle-gateway" is unknown'
          .github/workflows/*.yml

  coverage-badges:
    name: Coverage badge data
    needs: [cli-coverage, site-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quality-cli-results
          path: coverage-input/cli
      - uses: actions/download-artifact@v4
        with:
          name: quality-site-coverage
          path: coverage-input/site
      - name: Extract and validate measured line coverage
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p coverage-badges
          jq -e '.summary.linecoverage | select(type == "number" and . >= 0 and . <= 100) | {lineCoverage: ., commit: env.SOURCE_SHA}' coverage-input/cli/report/Summary.json > coverage-badges/cli.json
          jq -e '.total.lines.pct | select(type == "number" and . >= 0 and . <= 100) | {lineCoverage: ., commit: env.SOURCE_SHA}' coverage-input/site/coverage-summary.json > coverage-badges/site.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-coverage-badges
          path: coverage-badges/
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [vulnerabilities, codeql, cli-style, cli-coverage, site-style, site-coverage, workflow-lint, coverage-badges]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check to succeed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  publish-coverage-badges:
    name: Publish coverage badges
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quality-coverage-badges
          path: coverage-badges
      - name: Publish measured coverage without changing source files
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: coverage-badges
          publish_dir: coverage-badges
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update CLI and Site coverage badges'

  quality-comment:
    name: Comment quality results
    needs: [vulnerabilities, codeql, cli-style, cli-coverage, site-style, site-coverage, workflow-lint, coverage-badges, quality-gate]
    # Fork PR tokens are read-only; keep their checks running without attempting
    # to elevate permissions or making a missing comment fail their gate.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the quality results comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: quality-results
          message: |
            ### Quality results

            **Quality gate: ${{ needs.quality-gate.result }}**
            Commit: `${{ github.event.pull_request.head.sha }}` · [View run and reports](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            | Check | Result |
            | --- | --- |
            | Dependency vulnerabilities | ${{ needs.vulnerabilities.result }} |
            | CodeQL | ${{ needs.codeql.result }} |
            | CLI lint and format | ${{ needs.cli-style.result }} |
            | CLI tests and coverage | ${{ needs.cli-coverage.result }} |
            | Site lint and format | ${{ needs.site-style.result }} |
            | Site tests and coverage | ${{ needs.site-coverage.result }} |
            | Workflow lint | ${{ needs.workflow-lint.result }} |
            | Coverage badge data | ${{ needs.coverage-badges.result }} |

            | Line coverage | Measured | Minimum |
            | --- | ---: | ---: |
            | CLI | ${{ needs.cli-coverage.outputs.lines != '' && format('{0}%', needs.cli-coverage.outputs.lines) || 'Not available' }} | 100% |
            | Site | ${{ needs.site-coverage.outputs.lines != '' && format('{0}%', needs.site-coverage.outputs.lines) || 'Not available' }} | 80% |

            CLI line, branch, method, and full method coverage must each reach 100%. A missing report is shown as unavailable. See the linked run for test failures, detailed CLI/Site coverage summaries and HTML reports, and scanner results.
