# SyncSQL - scheduled extraction of MSSQL / Oracle database objects into git.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CI_JOB_Maintainer_Token                Project access token with the
#                                           Maintainer role and
#                                           write_repository scope, used to
#                                           push extracted objects back into
#                                           this project (Protected, Masked).
#                                           The built-in CI_JOB_TOKEN cannot
#                                           push, hence a dedicated token.
#   <PREFIX>_DB_USER / <PREFIX>_DB_PASSWORD
#                                           One pair per server entry in
#                                           config/servers.json, where <PREFIX>
#                                           is that server's
#                                           credentialsVariablePrefix
#                                           (Protected, Masked).
#   NEXUS_NUGET_SOURCE_URL / NEXUS_API_KEY  Only needed by cli/.gitlab-ci.yml's
#                                           cli-publish job and by
#                                           validate-config/extract-server/
#                                           sync-database-objects below (to
#                                           install the published syncsql
#                                           tool) - see cli/docs/cli.md.
#
# Trigger a schedule under CI/CD > Schedules pointing at this pipeline; the
# extract/sync/pages jobs only run for schedule (or manually-triggered
# "web"/API) pipeline sources, never on ordinary branch pushes.
#
# validate-config, extract-server, and sync-database-objects all run the
# syncsql .NET CLI (cli/, see cli/docs/cli.md) rather than the retired
# Windows PowerShell 5.1 pipeline - a portable Linux image, no Windows runner
# needed. The CLI itself is built, tested, and published to Nexus by
# cli/.gitlab-ci.yml, included below; these jobs just install whatever
# version is currently published there. Extraction is fanned out across the
# fleet as parallel per-server jobs (extract-server) feeding one final
# sync-database-objects job that publishes everything in a single commit -
# see extract-server's own comment below for the tradeoff that buys.

include:
  - local: 'cli/.gitlab-ci.yml'

stages:
  - cli-lint
  - cli-test
  - cli-build
  - cli-publish
  - validate
  - extract
  - sync
  - pages

variables:
  CONFIG_PATH: "$CI_PROJECT_DIR/config/servers.json"
  EXTRACTED_OBJECTS_DIR: "$CI_PROJECT_DIR/extracted-objects"
  METRICS_SNAPSHOT_DIR: "$CI_PROJECT_DIR/metrics-snapshot"
  GIT_DEPTH: "1"
  # How many commits (touching config.git.pathPrefix) get mined for the
  # change-heatmap / co-change / per-object version history features baked
  # into catalog.json, and how deep sync-database-objects's own clone of the
  # target repo goes so that history is actually there to mine. catalog.json
  # is generated and committed *by* sync-database-objects, alongside the
  # extracted objects themselves, so it's versioned right along with them
  # rather than living only as a separate CI artifact.
  HISTORY_LIMIT: "250"
  # How many daily volume/index/optimizer-statistics snapshots are kept per
  # table (metrics/ tree, outside git.pathPrefix - see "syncsql metrics
  # update" and README's "Volatile metrics"). This data changes every run by
  # nature, so it's tracked separately from each object's own version
  # history rather than bloating it.
  METRICS_HISTORY_LIMIT: "90"

.sync_rules: &sync_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_PIPELINE_SOURCE == "trigger"'

.syncsql_cli:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script:
    - dotnet tool install --global SyncSql.Cli --add-source "$NEXUS_NUGET_SOURCE_URL"
    - export PATH="$PATH:$HOME/.dotnet/tools"

validate-config:
  extends: .syncsql_cli
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      if [ -f "config/servers.json" ]; then CONFIG_FILE="config/servers.json"; else CONFIG_FILE="config/servers.example.json"; fi
    - syncsql validate-config --config "$CONFIG_FILE"

# Extracts one server's database objects - in parallel with every other entry
# in the matrix below, each as its own CI job. Every instance writes to the
# SAME --staging-root/--metrics-snapshot-root: extraction always writes under
# <server>/... first (see ExtractedObjectFile.RelativePath), so concurrent
# instances scoped to different servers never collide, and GitLab merges every
# instance's artifacts together for the downstream sync-database-objects job
# below (a plain job-name in `dependencies:` pulls in *all* instances of a
# `parallel:` job). No git operation happens here - see sync-database-objects.
#
# The SERVER_NAME list must match every server config/servers.json's
# serverSelection would actually run for this pipeline; keep it in sync by
# hand whenever the fleet changes - a server present in config/servers.json
# but missing here silently isn't extracted. For a small fleet where that
# upkeep isn't worth it, drop this job and the matrix, and instead give
# sync-database-objects below `syncsql sync --config "$CONFIG_PATH"
# --staging-root "$EXTRACTED_OBJECTS_DIR" --metrics-snapshot-root
# "$METRICS_SNAPSHOT_DIR" --dotenv-path ... --history-limit ...
# --metrics-history-limit ...` as its own script instead of `git publish` -
# same end result, back to one sequential job extracting every server.
extract-server:
  extends: .syncsql_cli
  stage: extract
  rules: *sync_rules
  timeout: 1h
  parallel:
    matrix:
      - SERVER_NAME: ["SQLPROD01", "SQLPROD02_FINANCE_ONLY", "ORAPROD01"]
  script:
    - syncsql sync --config "$CONFIG_PATH" --skip-git --server-include "^${SERVER_NAME}$" --staging-root "$EXTRACTED_OBJECTS_DIR" --metrics-snapshot-root "$METRICS_SNAPSHOT_DIR"
  artifacts:
    paths:
      - extracted-objects/
      - metrics-snapshot/
    expire_in: 1 day

# Publishes the merged output of every extract-server instance above: clone,
# replace config.git.pathPrefix, fold metrics, rebuild catalog.json (structure,
# inferred lineage - real T-SQL/PL-SQL parsing, not text matching - and
# history/heatmap/point-in-time data mined from this same repo's own commit
# history), commit, push - all in one commit, same as before. No extraction of
# its own; see `syncsql git publish` in cli/docs/cli.md.
sync-database-objects:
  extends: .syncsql_cli
  stage: sync
  rules: *sync_rules
  dependencies:
    - extract-server
  script:
    - syncsql git publish --config "$CONFIG_PATH" --staging-root "$EXTRACTED_OBJECTS_DIR" --metrics-snapshot-root "$METRICS_SNAPSHOT_DIR" --dotenv-path "$CI_PROJECT_DIR/sync.env" --history-limit "$HISTORY_LIMIT" --metrics-history-limit "$METRICS_HISTORY_LIMIT"
  artifacts:
    reports:
      dotenv: sync.env
    expire_in: 1 day

# Builds site/ (React/Vite) and publishes it as a GitLab Pages site. Reads
# catalog.json straight out of the git checkout (sync-database-objects just
# committed it there) rather than via a separate CI artifact. The "pages"
# job name is what makes GitLab treat this as a Pages deployment; its
# artifacts must be a directory named exactly "public" at the project root.
pages:
  stage: pages
  image: node:20-alpine
  rules: *sync_rules
  dependencies:
    - sync-database-objects
  cache:
    key:
      files:
        - site/package-lock.json
    paths:
      - site/node_modules/
  before_script:
    # sync-database-objects just pushed a new commit (with catalog.json in
    # it); this job's own checkout was taken from the pipeline's original
    # commit, so bring the branch tip back in first. PATH_PREFIX/GIT_BRANCH
    # come from sync-database-objects's dotenv report above.
    - command -v git >/dev/null || apk add --no-cache git
    - git fetch origin "${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
    - git reset --hard "origin/${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
  script:
    - mkdir -p site/public/data
    - cp "${PATH_PREFIX:-objects}/catalog.json" site/public/data/catalog.json
    - cd site
    - npm ci
    - npm run build
    - cd ..
    - rm -rf public
    - mv site/dist public
  artifacts:
    paths:
      - public
