# SyncSQL - scheduled extraction of MSSQL / Oracle database objects into git.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CI_JOB_Maintainer_Token                Project access token with the
#                                           Maintainer role and
#                                           write_repository scope, used to
#                                           push extracted objects back into
#                                           this project (Protected, Masked).
#                                           The built-in CI_JOB_TOKEN cannot
#                                           push, hence a dedicated token.
#   <PREFIX>_DB_USER / <PREFIX>_DB_PASSWORD
#                                           One pair per server entry in
#                                           config/servers.yml, where <PREFIX>
#                                           is that server's
#                                           credentialsVariablePrefix
#                                           (Protected, Masked).
#
# Trigger a schedule under CI/CD > Schedules pointing at this pipeline; the
# sync/analyze/pages jobs only run for schedule (or manually-triggered
# "web"/API) sources, never on ordinary branch pushes.

stages:
  - validate
  - sync
  - analyze
  - pages

variables:
  MODULES_CACHE_DIR: "$CI_PROJECT_DIR/.pwsh-modules"
  CONFIG_PATH: "$CI_PROJECT_DIR/config/servers.yml"
  EXTRACTED_OBJECTS_DIR: "$CI_PROJECT_DIR/extracted-objects"
  CATALOG_DIR: "$CI_PROJECT_DIR/catalog"
  GIT_DEPTH: "1"
  # How many commits (touching config.git.pathPrefix) the analyze stage mines
  # for the change-heatmap / co-change / per-object version history features.
  # Also used to widen the analyze job's own checkout depth so that history
  # is actually there to mine.
  HISTORY_LIMIT: "250"

.sync_rules: &sync_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_PIPELINE_SOURCE == "trigger"'

.pwsh_cache:
  cache:
    key: pwsh-deps-v1
    paths:
      - .pwsh-modules/

validate-config:
  extends: .pwsh_cache
  stage: validate
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - pwsh -NoProfile -File src/Bootstrap-Dependencies.ps1 -ModulesCacheDir "$MODULES_CACHE_DIR"
    - |
      pwsh -NoProfile -Command '
        $ErrorActionPreference = "Stop"
        $env:PSModulePath = "$env:MODULES_CACHE_DIR/Modules" + [IO.Path]::PathSeparator + $env:PSModulePath
        Import-Module ./src/modules/SyncSql.Common.psm1 -Force
        $configPath = if (Test-Path "config/servers.yml") { "config/servers.yml" } else { "config/servers.example.yml" }
        $config = Import-SyncSqlConfig -Path $configPath
        Write-Host "OK: $($config.servers.Count) server(s) defined in $configPath"
      '

sync-database-objects:
  extends: .pwsh_cache
  stage: sync
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  rules: *sync_rules
  timeout: 2h
  before_script:
    - pwsh -NoProfile -File src/Bootstrap-Dependencies.ps1 -ModulesCacheDir "$MODULES_CACHE_DIR"
  script:
    - pwsh -NoProfile -File src/Export-DatabaseObjects.ps1 -ConfigPath "$CONFIG_PATH" -ModulesCacheDir "$MODULES_CACHE_DIR" -StagingRoot "$EXTRACTED_OBJECTS_DIR" -DotenvPath "$CI_PROJECT_DIR/sync.env"
  artifacts:
    paths:
      - extracted-objects/
    reports:
      dotenv: sync.env
    expire_in: 1 day

# Best-effort lineage/documentation/history analysis over the tree
# sync-database-objects just produced - see src/Build-Catalog.ps1 for what
# "best-effort" means here.
analyze-catalog:
  stage: analyze
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  rules: *sync_rules
  # Widen this job's own checkout so there's enough history to mine (the
  # global GIT_DEPTH above stays shallow for the other jobs, which don't
  # need history).
  variables:
    GIT_DEPTH: "$HISTORY_LIMIT"
  dependencies:
    - sync-database-objects
  before_script:
    # The base image doesn't guarantee a git CLI (GitLab's own automatic
    # checkout of this project runs through a separate helper image, not
    # this one) - install it if it's missing before using it below.
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
    # sync-database-objects may have just pushed a new commit; this job's
    # checkout was taken from the pipeline's original commit, so bring the
    # branch tip back in before mining history from it. PATH_PREFIX/GIT_BRANCH
    # come from sync-database-objects's dotenv report above (falls back to
    # the config defaults if that job didn't run/produced nothing, e.g. a
    # partial rerun).
    - git fetch origin "${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
    - git reset --hard "origin/${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
  script:
    - pwsh -NoProfile -File src/Build-Catalog.ps1 -ObjectsRoot "$EXTRACTED_OBJECTS_DIR" -OutputPath "$CATALOG_DIR/catalog.json" -RepoRoot "$CI_PROJECT_DIR" -PathPrefix "${PATH_PREFIX:-objects}" -HistoryLimit "$HISTORY_LIMIT"
  artifacts:
    paths:
      - catalog/
    expire_in: 1 day

# Builds site/ (React/Vite) with the freshly generated catalog.json and
# publishes it as a GitLab Pages site. The "pages" job name is what makes
# GitLab treat this as a Pages deployment; its artifacts must be a directory
# named exactly "public" at the project root.
pages:
  stage: pages
  image: node:20-alpine
  rules: *sync_rules
  dependencies:
    - analyze-catalog
  cache:
    key:
      files:
        - site/package-lock.json
    paths:
      - site/node_modules/
  script:
    - mkdir -p site/public/data
    - cp "$CATALOG_DIR/catalog.json" site/public/data/catalog.json
    - cd site
    - npm ci
    - npm run build
    - cd ..
    - rm -rf public
    - mv site/dist public
  artifacts:
    paths:
      - public
