# SyncSQL - scheduled extraction of MSSQL / Oracle database objects into git.
#
# This file only declares the shared stages/variables and includes the CI
# modules under .gitlab/ci/. For the full pipeline explanation - what each
# module/job does, required CI/CD variables, trigger rules, and design
# rationale - see .gitlab/README.md.

include:
  - local: '.gitlab/ci/cli.yml'
  - local: '.gitlab/ci/extract.yml'
  - local: '.gitlab/ci/sync.yml'
  - local: '.gitlab/ci/pages.yml'

stages:
  - cli-lint
  - cli-test
  - cli-build
  - cli-publish
  - validate
  - extract
  - sync
  - pages

variables:
  CONFIG_PATH: "$CI_PROJECT_DIR/config/servers.json"
  EXTRACTED_OBJECTS_DIR: "$CI_PROJECT_DIR/extracted-objects"
  METRICS_SNAPSHOT_DIR: "$CI_PROJECT_DIR/metrics-snapshot"
  GIT_DEPTH: "1"
  # See .gitlab/README.md's "Required CI/CD variables" for what these control.
  HISTORY_LIMIT: "250"
  METRICS_HISTORY_LIMIT: "90"
