# SyncSQL - scheduled extraction of MSSQL / Oracle database objects into git.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CI_JOB_Maintainer_Token                Project access token with the
#                                           Maintainer role and
#                                           write_repository scope, used to
#                                           push extracted objects back into
#                                           this project (Protected, Masked).
#                                           The built-in CI_JOB_TOKEN cannot
#                                           push, hence a dedicated token.
#                                           Falls back to GIT_PUSH_TOKEN if
#                                           unset.
#   <PREFIX>_DB_USER / <PREFIX>_DB_PASSWORD
#                                           One pair per server entry in
#                                           config/servers.json, where <PREFIX>
#                                           is that server's
#                                           credentialsVariablePrefix
#                                           (Protected, Masked).
#   NEXUS_NUGET_SOURCE_URL / NEXUS_API_KEY  Only needed by cli/.gitlab-ci.yml's
#                                           cli-publish job and by
#                                           validate-config/extract-server/
#                                           sync-database-objects below (to
#                                           install the published syncsql
#                                           tool) - see cli/docs/cli.md.
#
# Trigger a schedule under CI/CD > Schedules pointing at this pipeline; the
# extract/sync/pages jobs only run for schedule (or manually-triggered
# "web"/API) pipeline sources, never on ordinary branch pushes.
#
# The syncsql .NET CLI (cli/, see cli/docs/cli.md) only ever touches local
# files - it extracts database objects, folds metrics history, and builds
# catalog.json, but never clones, commits, or pushes anything itself. All git
# operations (clone, replace config.git.pathPrefix, commit, push) happen
# directly in sync-database-objects's own shell script below, which reads
# config.git.* itself via `jq` - a deliberate split: the CLI is a pure,
# git-agnostic data pipeline you can run and test anywhere, and this pipeline
# is the one and only place that decides how/where results get published.
#
# validate-config, extract-server, and sync-database-objects all run a
# portable Linux image (mcr.microsoft.com/dotnet/sdk:10.0), installing the
# syncsql tool from Nexus - no Windows runner needed. The CLI itself is
# built, tested, and published to Nexus by cli/.gitlab-ci.yml, included
# below; these jobs just install whatever version is currently published
# there. Extraction is fanned out across the fleet as parallel per-server
# jobs (extract-server) feeding one final sync-database-objects job that
# publishes everything in a single commit - see extract-server's own comment
# below for the tradeoff that buys.

include:
  - local: 'cli/.gitlab-ci.yml'

stages:
  - cli-lint
  - cli-test
  - cli-build
  - cli-publish
  - validate
  - extract
  - sync
  - pages

variables:
  CONFIG_PATH: "$CI_PROJECT_DIR/config/servers.json"
  EXTRACTED_OBJECTS_DIR: "$CI_PROJECT_DIR/extracted-objects"
  METRICS_SNAPSHOT_DIR: "$CI_PROJECT_DIR/metrics-snapshot"
  GIT_DEPTH: "1"
  # How many commits (touching config.git.pathPrefix) get mined for the
  # change-heatmap / co-change / per-object version history features baked
  # into catalog.json, and how deep sync-database-objects's own clone of the
  # target repo goes so that history is actually there to mine. catalog.json
  # is generated and committed *by* sync-database-objects, alongside the
  # extracted objects themselves, so it's versioned right along with them
  # rather than living only as a separate CI artifact.
  HISTORY_LIMIT: "250"
  # How many daily volume/index/optimizer-statistics snapshots are kept per
  # table (metrics/ tree, outside git.pathPrefix - see "syncsql metrics
  # update" and README's "Volatile metrics"). This data changes every run by
  # nature, so it's tracked separately from each object's own version
  # history rather than bloating it.
  METRICS_HISTORY_LIMIT: "90"

.sync_rules: &sync_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_PIPELINE_SOURCE == "trigger"'

.syncsql_cli:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script:
    - dotnet tool install --global SyncSql.Cli --add-source "$NEXUS_NUGET_SOURCE_URL"
    - export PATH="$PATH:$HOME/.dotnet/tools"

validate-config:
  extends: .syncsql_cli
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      if [ -f "config/servers.json" ]; then CONFIG_FILE="config/servers.json"; else CONFIG_FILE="config/servers.example.json"; fi
    - syncsql validate-config --config "$CONFIG_FILE"

# Extracts one server's database objects - in parallel with every other entry
# in the matrix below, each as its own CI job. Every instance writes to the
# SAME --staging-root/--metrics-snapshot-root: extraction always writes under
# <server>/... first (see ExtractedObjectFile.RelativePath), so concurrent
# instances scoped to different servers never collide, and GitLab merges every
# instance's artifacts together for the downstream sync-database-objects job
# below (a plain job-name in `dependencies:` pulls in *all* instances of a
# `parallel:` job). Purely local - no git operation happens here or anywhere
# in the CLI; see sync-database-objects for where that lives.
#
# The SERVER_NAME list must match every server config/servers.json's
# serverSelection would actually run for this pipeline; keep it in sync by
# hand whenever the fleet changes - a server present in config/servers.json
# but missing here silently isn't extracted. For a small fleet where that
# upkeep isn't worth it, drop this job and the matrix, and instead give
# sync-database-objects below a first script line of `syncsql sync --config
# "$CONFIG_PATH" --staging-root "$EXTRACTED_OBJECTS_DIR"
# --metrics-snapshot-root "$METRICS_SNAPSHOT_DIR"` (no `--server-include`, so
# every server extracts) ahead of its existing git script - same end result,
# back to one sequential job doing everything.
extract-server:
  extends: .syncsql_cli
  stage: extract
  rules: *sync_rules
  timeout: 1h
  parallel:
    matrix:
      - SERVER_NAME: ["SQLPROD01", "SQLPROD02_FINANCE_ONLY", "ORAPROD01"]
  script:
    - syncsql sync --config "$CONFIG_PATH" --server-include "^${SERVER_NAME}$" --staging-root "$EXTRACTED_OBJECTS_DIR" --metrics-snapshot-root "$METRICS_SNAPSHOT_DIR"
  artifacts:
    paths:
      - extracted-objects/
      - metrics-snapshot/
    expire_in: 1 day

# Publishes the merged output of every extract-server instance above. This is
# the ONLY place git actually runs in this pipeline: everything git-shaped -
# resolving config.git.* (via `jq`, since the CLI itself never reads that
# block), cloning, replacing config.git.pathPrefix with the merged staged
# tree, committing, and pushing - is a plain shell script here, calling
# `syncsql metrics update` and `syncsql catalog build` only for the pure,
# non-git steps (folding this run's metrics into history, and rebuilding
# catalog.json - structure, inferred lineage via a real parser per engine,
# and history/heatmap/point-in-time mined from this repo's own commit
# history). One commit carries the extracted objects, catalog.json, and the
# updated metrics/ tree together.
sync-database-objects:
  extends: .syncsql_cli
  stage: sync
  rules: *sync_rules
  dependencies:
    - extract-server
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git jq -qq
    - |
      set -euo pipefail

      # config.git.* - defaults match what SyncSQL has always used (see
      # README's Configuration section). The CLI never resolves or acts on
      # this block itself; this script is the one place that does.
      GIT_CFG=$(jq -c '.git // {}' "$CONFIG_PATH")
      BRANCH=$(echo "$GIT_CFG" | jq -r '.branch // "main"')
      PATH_PREFIX=$(echo "$GIT_CFG" | jq -r '.pathPrefix // "objects"')
      COMMIT_USER_NAME=$(echo "$GIT_CFG" | jq -r '.commitUserName // "SyncSQL Bot"')
      COMMIT_USER_EMAIL=$(echo "$GIT_CFG" | jq -r '.commitUserEmail // "syncsql-bot@example.com"')
      COMMIT_MESSAGE=$(echo "$GIT_CFG" | jq -r '.commitMessage // "chore(sync): update database objects"')
      REMOTE_URL=$(echo "$GIT_CFG" | jq -r '.remoteUrl // empty')
      if [ -z "$REMOTE_URL" ]; then
        REMOTE_URL="${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi

      PUSH_TOKEN="${CI_JOB_Maintainer_Token:-${GIT_PUSH_TOKEN:-}}"
      if [ -z "$PUSH_TOKEN" ]; then
        echo "No push token supplied. Set the CI_JOB_Maintainer_Token CI/CD variable (a Maintainer-role token with write_repository scope) or GIT_PUSH_TOKEN." >&2
        exit 1
      fi

      # The push token is handed to git only through GIT_ASKPASS plus a
      # process environment variable - never a CLI argument, never embedded
      # in the remote URL - so it can't leak via a process listing, `git
      # remote -v`, or shell history.
      ASKPASS_SCRIPT=$(mktemp)
      cat > "$ASKPASS_SCRIPT" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
          Username*) printf '%s' "oauth2" ;;
          *)         printf '%s' "$SYNCSQL_GIT_PASSWORD" ;;
      esac
      ASKPASS
      chmod 700 "$ASKPASS_SCRIPT"
      export GIT_ASKPASS="$ASKPASS_SCRIPT"
      export GIT_TERMINAL_PROMPT=0
      export SYNCSQL_GIT_PASSWORD="$PUSH_TOKEN"

      CLONE_DIR=$(mktemp -d)
      echo "Cloning target repository (branch '$BRANCH', depth $HISTORY_LIMIT)"
      if ! git clone --branch "$BRANCH" --single-branch --depth "$HISTORY_LIMIT" "$REMOTE_URL" "$CLONE_DIR"; then
        echo "Branch '$BRANCH' not found on remote yet; cloning default branch and creating it."
        rm -rf "$CLONE_DIR"
        git clone --depth "$HISTORY_LIMIT" "$REMOTE_URL" "$CLONE_DIR"
        git -C "$CLONE_DIR" checkout -B "$BRANCH"
      fi

      git -C "$CLONE_DIR" config user.name "$COMMIT_USER_NAME"
      git -C "$CLONE_DIR" config user.email "$COMMIT_USER_EMAIL"

      # Wipe and repopulate so objects dropped from the source database (or
      # excluded by an updated filter) show up as deletions in git.
      TARGET_DIR="$CLONE_DIR/$PATH_PREFIX"
      rm -rf "$TARGET_DIR"
      mkdir -p "$TARGET_DIR"
      if [ -d "$EXTRACTED_OBJECTS_DIR" ]; then
        cp -a "$EXTRACTED_OBJECTS_DIR"/. "$TARGET_DIR"/
      fi

      METRICS_HISTORY_DIR="$CLONE_DIR/metrics"
      echo "Updating metrics history ($METRICS_HISTORY_LIMIT-snapshot retention) -> $METRICS_HISTORY_DIR"
      syncsql metrics update --snapshot-root "$METRICS_SNAPSHOT_DIR" --history-root "$METRICS_HISTORY_DIR" --history-limit "$METRICS_HISTORY_LIMIT"

      echo "Building catalog.json ($HISTORY_LIMIT-commit history window) -> $TARGET_DIR/catalog.json"
      syncsql catalog build --objects-root "$TARGET_DIR" --output "$TARGET_DIR/catalog.json" --repo-root "$CLONE_DIR" --path-prefix "$PATH_PREFIX" --history-limit "$HISTORY_LIMIT" --metrics-root "$METRICS_HISTORY_DIR"

      git -C "$CLONE_DIR" add -A
      if git -C "$CLONE_DIR" diff --cached --quiet; then
        echo "No changes detected; nothing to publish."
      else
        git -C "$CLONE_DIR" commit -m "$COMMIT_MESSAGE"
        echo "Pushing to '$BRANCH'"
        git -C "$CLONE_DIR" push origin "HEAD:$BRANCH"
      fi

      echo "PATH_PREFIX=$PATH_PREFIX" > "$CI_PROJECT_DIR/sync.env"
      echo "GIT_BRANCH=$BRANCH" >> "$CI_PROJECT_DIR/sync.env"
  artifacts:
    reports:
      dotenv: sync.env
    expire_in: 1 day

# Builds site/ (React/Vite) and publishes it as a GitLab Pages site. Reads
# catalog.json straight out of the git checkout (sync-database-objects just
# committed it there) rather than via a separate CI artifact. The "pages"
# job name is what makes GitLab treat this as a Pages deployment; its
# artifacts must be a directory named exactly "public" at the project root.
pages:
  stage: pages
  image: node:20-alpine
  rules: *sync_rules
  dependencies:
    - sync-database-objects
  cache:
    key:
      files:
        - site/package-lock.json
    paths:
      - site/node_modules/
  before_script:
    # sync-database-objects just pushed a new commit (with catalog.json in
    # it); this job's own checkout was taken from the pipeline's original
    # commit, so bring the branch tip back in first. PATH_PREFIX/GIT_BRANCH
    # come from sync-database-objects's dotenv report above.
    - command -v git >/dev/null || apk add --no-cache git
    - git fetch origin "${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
    - git reset --hard "origin/${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
  script:
    - mkdir -p site/public/data
    - cp "${PATH_PREFIX:-objects}/catalog.json" site/public/data/catalog.json
    - cd site
    - npm ci
    - npm run build
    - cd ..
    - rm -rf public
    - mv site/dist public
  artifacts:
    paths:
      - public
