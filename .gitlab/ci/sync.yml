# CI module that publishes extracted database objects back into git. See
# ../README.md for the full explanation of this job - it's the only place
# git actually runs in the pipeline.
#
# The job itself is deliberately thin: every step lives in
# scripts/Publish-SyncSqlObjects.ps1, which takes all of it as parameters so the
# exact same publish can be run (and dry-run, with -SkipPush) from a workstation.

sync-database-objects:
  extends:
    - .syncsql_cli
    - .sync_rules
  stage: sync
  dependencies:
    - extract-server
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git -qq
    # The publish script targets Windows PowerShell 5.1, so it also runs unchanged on the
    # PowerShell 7 this Linux image needs. The .NET SDK image may or may not ship it
    # depending on the tag; install it as a dotnet tool when it's missing (mirror the
    # PowerShell package in Nexus and add --add-source "$NEXUS_NUGET_SOURCE_URL" if
    # nuget.org isn't reachable). On a Windows runner, drop this line and call the script
    # with: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ...
    - command -v pwsh >/dev/null 2>&1 || dotnet tool install --global PowerShell
    - |
      pwsh -NoProfile -NonInteractive -File "$PUBLISH_SCRIPT" \
        -ExtractedObjectsDir "$EXTRACTED_OBJECTS_DIR" \
        -MetricsSnapshotDir "$METRICS_SNAPSHOT_DIR" \
        -ConfigPath "$CONFIG_PATH" \
        -RemoteUrl "${SYNC_REMOTE_URL:-${CI_SERVER_PROTOCOL}://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git}" \
        -MetricsHistoryDirName "$METRICS_HISTORY_DIR_NAME" \
        -CatalogFileName "$CATALOG_FILE_NAME" \
        -HistoryLimit "$HISTORY_LIMIT" \
        -MetricsHistoryLimit "$METRICS_HISTORY_LIMIT" \
        -MaxVersionsPerObject "$MAX_VERSIONS_PER_OBJECT" \
        -MaxHistoryContentCalls "$MAX_HISTORY_CONTENT_CALLS" \
        -MaxCoChangeCommitSize "$MAX_CO_CHANGE_COMMIT_SIZE" \
        -DotEnvPath "$CI_PROJECT_DIR/sync.env"
    # -PushToken is deliberately not passed: the script reads the token from
    # CI_JOB_Maintainer_Token/GIT_PUSH_TOKEN in its environment and hands it to git
    # through a credential helper, so it never lands in a command line or the log.
  artifacts:
    reports:
      dotenv: sync.env
    expire_in: 1 day
