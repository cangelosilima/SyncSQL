# CI module for the prebuilt PL/SQL parser package (the grammar/ folder).
#
# This is the only job in the pipeline that needs Java. It runs the ANTLR4 tool over
# grammar/src/SyncSql.Grammar.PlSql/Grammar/*.g4 and publishes the result to Nexus as
# SyncSql.Grammar.PlSql, which cli/src/SyncSql.Lineage.Oracle then consumes as an ordinary
# package - so none of the cli-* jobs need a JRE, a jar, or any generated code.
#
# Manual on purpose: the grammar changes roughly never, and each run publishes a package
# version. See ../../grammar/README.md for the full regenerate-and-publish walkthrough.

stages:
  - grammar-publish

grammar-publish:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  stage: grammar-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - grammar/**/*
      when: manual
      allow_failure: true
  variables:
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
    # Where AntlrTool.targets caches the ANTLR4 tool jar it downloads (default ~/.m2, which
    # isn't cacheable here). Add an AntlrToolJarUrl CI/CD variable pointing at the same
    # antlr4-<version>-complete.jar on the Nexus mirror if the runner can't reach Maven Central.
    AntlrToolJarDir: "$CI_PROJECT_DIR/.antlr"
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends default-jre-headless -qq
  script:
    - dotnet pack grammar/src/SyncSql.Grammar.PlSql --configuration Release --output ./nupkg
    - dotnet nuget push "./nupkg/*.nupkg" --source "$NEXUS_NUGET_SOURCE_URL" --api-key "$NEXUS_API_KEY" --skip-duplicate
  cache:
    key: grammar-deps-v1
    paths:
      - .nuget/packages/
      - .antlr/
