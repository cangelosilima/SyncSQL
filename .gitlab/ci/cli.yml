# CI module for the syncsql .NET CLI (the cli/ folder). See ../README.md for
# the full explanation of these jobs, required variables, and how this
# module is included from the root .gitlab-ci.yml.

stages:
  - cli-lint
  - cli-test
  - cli-build
  - cli-publish

variables:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

.cli_dotnet: &cli_dotnet
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cli/**/*
        - grammar/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - cli/**/*
        - grammar/**/*
  before_script:
    - cd cli
  cache:
    key: cli-deps-v3
    paths:
      - .nuget/packages/

cli-lint:
  <<: *cli_dotnet
  stage: cli-lint
  script:
    # grammar/ is generated ANTLR output committed as-is; it is excluded for the
    # same reason .gitattributes exempts it from whitespace checks - reformatting
    # it would break byte-for-byte reproducibility with the documented generator
    # command. The GitHub Actions workflow (.github/workflows/ci.yml) runs the
    # same line.
    - dotnet format SyncSql.slnx --verify-no-changes --exclude ../grammar/

cli-test:
  <<: *cli_dotnet
  stage: cli-test
  script:
    - dotnet test SyncSql.slnx --configuration Release --logger "console;verbosity=normal"

cli-build:
  <<: *cli_dotnet
  stage: cli-build
  script:
    - dotnet build SyncSql.slnx --configuration Release

cli-publish:
  <<: *cli_dotnet
  stage: cli-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - cli/**/*
        - grammar/**/*
  script:
    - dotnet pack src/SyncSql.Cli --configuration Release --output ./nupkg
    - dotnet nuget push "./nupkg/*.nupkg" --source "$NEXUS_NUGET_SOURCE_URL" --api-key "$NEXUS_API_KEY" --skip-duplicate
