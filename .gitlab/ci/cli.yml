# CI module for the syncsql .NET CLI (the cli/ folder). See ../README.md for
# the full explanation of these jobs, required variables, and how this
# module is included from the root .gitlab-ci.yml.

stages:
  - cli-lint
  - cli-test
  - cli-build
  - cli-publish

variables:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # SyncSql.Lineage.Oracle generates its PL/SQL lexer/parser from Grammar/*.g4 at build time
  # using the Java ANTLR4 tool. cli/src/SyncSql.Lineage.Oracle/AntlrTool.targets fetches that
  # jar into this directory (default ~/.m2, which isn't cacheable here) so the cache below
  # keeps it between pipelines. Set AntlrToolJarUrl too if Maven Central isn't reachable from
  # the runner - point it at the antlr4-<version>-complete.jar on the Nexus mirror.
  AntlrToolJarDir: "$CI_PROJECT_DIR/.antlr"

.cli_dotnet: &cli_dotnet
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cli/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - cli/**/*
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends default-jre-headless -qq
    - cd cli
  cache:
    key: cli-deps-v2
    paths:
      - .nuget/packages/
      - .antlr/

cli-lint:
  <<: *cli_dotnet
  stage: cli-lint
  script:
    - dotnet format SyncSql.slnx --verify-no-changes
        --exclude src/SyncSql.Lineage.Oracle/Grammar/PlSqlLexerBase.cs src/SyncSql.Lineage.Oracle/Grammar/PlSqlParserBase.cs

cli-test:
  <<: *cli_dotnet
  stage: cli-test
  script:
    - dotnet test SyncSql.slnx --configuration Release --logger "console;verbosity=normal"

cli-build:
  <<: *cli_dotnet
  stage: cli-build
  script:
    - dotnet build SyncSql.slnx --configuration Release

cli-publish:
  <<: *cli_dotnet
  stage: cli-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - cli/**/*
  script:
    - dotnet pack src/SyncSql.Cli --configuration Release --output ./nupkg
    - dotnet nuget push "./nupkg/*.nupkg" --source "$NEXUS_NUGET_SOURCE_URL" --api-key "$NEXUS_API_KEY" --skip-duplicate
