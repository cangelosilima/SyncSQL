# CI module that builds and publishes the catalog site as GitLab Pages. See
# ../README.md for the full explanation of this job.

pages:
  extends: .sync_rules
  stage: pages
  image: node:20-alpine
  dependencies:
    - sync-database-objects
  cache:
    key:
      files:
        - site/package-lock.json
    paths:
      - site/node_modules/
  before_script:
    - command -v git >/dev/null || apk add --no-cache git
    - git fetch origin "${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
    - git reset --hard "origin/${GIT_BRANCH:-$CI_COMMIT_REF_NAME}"
  script:
    - mkdir -p site/public/data
    # PATH_PREFIX comes from sync-database-objects' dotenv report and is normally
    # empty - the extracted tree starts at the repository root with the server
    # name - so the separator is appended only when there is a prefix to append.
    # A ${PATH_PREFIX:-objects} style default would be wrong twice over here: it
    # fires on an empty value as well as an unset one, and the default is no
    # longer "objects".
    - cp "${PATH_PREFIX:+$PATH_PREFIX/}${CATALOG_FILE_NAME:-catalog.json}" site/public/data/catalog.json
    - cd site
    - npm ci
    - npm test
    # Model packaging is optional here: npm run build emits a warning and an
    # unavailable capability manifest when LFS assets are absent or invalid.
    - npm run build
    - cd ..
    - rm -rf public
    - mv site/dist public
  artifacts:
    paths:
      - public
